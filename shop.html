<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop all products — eTrade</title>
  <meta name="theme-color" content="#1a8fdd">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='70' font-size='64' font-family='Arial' font-weight='700' fill='%231a8fdd' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <span id="crumb">Shop</span></div>
    <div class="shop-layout">
      <aside class="filters" id="filters">
        <h4 style="font-size:1.1rem">Filters <button class="btn btn-sm btn-outline" id="clear-filters">Clear all</button></h4>
        <div class="filter-group"><h4>Category</h4><div id="f-cat"></div></div>
        <div class="filter-group"><h4>Brand</h4><div id="f-brand"></div></div>
        <div class="filter-group"><h4>Price (Rs.)</h4>
          <div class="range-row"><input type="number" id="f-min" placeholder="Min" min="0"><input type="number" id="f-max" placeholder="Max" min="0"></div>
          <input type="range" id="f-range" min="0" max="500000" step="5000" style="margin-top:12px">
          <small class="muted">Up to <b id="f-range-val"></b></small>
        </div>
        <div class="filter-group"><h4>Rating</h4>
          <label class="check"><input type="radio" name="rating" value="0" checked> Any rating</label>
          <label class="check"><input type="radio" name="rating" value="4.5"> 4.5 <i class="fa-solid fa-star" style="color:#f59e0b"></i> & up</label>
          <label class="check"><input type="radio" name="rating" value="4"> 4.0 <i class="fa-solid fa-star" style="color:#f59e0b"></i> & up</label>
        </div>
        <div class="filter-group"><h4>Availability</h4>
          <label class="check"><input type="checkbox" id="f-stock"> In stock only</label>
          <label class="check"><input type="checkbox" id="f-sale"> On sale</label>
        </div>
        <button class="btn btn-primary btn-block filter-toggle" data-close style="margin-top:16px">Show results</button>
      </aside>

      <section>
        <div class="toolbar">
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn btn-outline btn-sm filter-toggle" id="open-filters"><i class="fa-solid fa-sliders"></i> Filters</button>
            <span class="result-count" id="count"></span>
          </div>
          <div class="tb-right">
            <select class="select" id="sort" aria-label="Sort">
              <option value="featured">Sort: Featured</option>
              <option value="new">Newest first</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="rating">Top rated</option>
              <option value="discount">Biggest discount</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
        <div class="pagination" id="pager"></div>
      </section>
    </div>
  </main>

  <div id="site-footer-slot"></div>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>

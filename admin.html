<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — eTrade</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='70' font-size='64' font-family='Arial' font-weight='700' fill='%231a8fdd' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <!-- Login -->
  <div class="admin-login" id="login-view">
    <div class="panel">
      <a href="index.html" class="logo"><span class="logo-mark">e</span><span><b>e</b>Trade</span></a>
      <h2>Admin login</h2>
      <p class="muted" style="margin-bottom:20px">Sign in to manage products, orders and customers.</p>
      <form id="login-form" class="form-grid">
        <div class="field full"><label>Username</label><div class="input-icon"><i class="fa-regular fa-user"></i><input name="user" required autocomplete="username" placeholder="admin"></div></div>
        <div class="field full"><label>Password</label><div class="input-icon"><i class="fa-solid fa-lock"></i><input name="pass" type="password" required autocomplete="current-password" placeholder="••••••••"></div></div>
        <button class="btn btn-primary btn-block full"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
        <p class="muted full" style="font-size:.8rem;text-align:center">Demo credentials: <b>admin</b> / <b>admin123</b></p>
      </form>
      <a href="index.html" class="muted" style="display:block;text-align:center;margin-top:16px;font-size:.88rem"><i class="fa-solid fa-arrow-left"></i> Back to store</a>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="admin-shell hidden" id="admin-view">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="logo"><span class="logo-mark">e</span><span><b>e</b>Trade</span></a>
      <span class="sb-label">Main</span>
      <button data-view="dashboard" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
      <button data-view="products"><i class="fa-solid fa-box-open"></i> Products</button>
      <button data-view="orders"><i class="fa-solid fa-receipt"></i> Orders <span class="sb-badge" id="pending-badge"></span></button>
      <button data-view="customers"><i class="fa-solid fa-users"></i> Customers</button>
      <span class="sb-label">Marketing</span>
      <button data-view="coupons"><i class="fa-solid fa-ticket"></i> Coupons</button>
      <button data-view="settings"><i class="fa-solid fa-gear"></i> Settings</button>
      <div class="sb-foot">
        <a class="sb-link" href="index.html" target="_blank"><i class="fa-solid fa-store"></i> View store</a>
        <button id="admin-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-top">
        <button class="icon-btn sb-toggle" id="sb-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <h2 id="view-title">Dashboard</h2>
        <div class="right">
          <button class="btn btn-primary btn-sm hide-sm" data-new-product><i class="fa-solid fa-plus"></i> Add product</button>
          <button class="icon-btn" data-theme-toggle aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
          <span class="avatar" title="Admin">AD</span>
        </div>
      </header>
      <div class="admin-content" id="view"></div>
    </div>
  </div>

  <div class="overlay"></div>
  <div class="modal" id="admin-modal" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box form-modal"><button class="icon-btn modal-close" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button><div class="modal-content"></div></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
